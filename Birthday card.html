<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy birthday!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --kraft:#c29a6b; --kraft-dark:#9b7549; --ink:#5e0f2a; --paper:#fff6ea; --paper-edge:#d9b98f; --accent:#d9607c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --kraft:#a57d52; --kraft-dark:#7a5834; }
}
:root[data-theme="dark"]{ --kraft:#a57d52; --kraft-dark:#7a5834; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;overflow:hidden;background-color:var(--kraft);
  background-image:
    radial-gradient(ellipse at 50% 45%,rgba(255,236,200,.28),rgba(70,40,10,.38) 100%),
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='600'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.012 .5' numOctaves='3' seed='4'/%3E%3CfeColorMatrix values='0 0 0 0 .3 0 0 0 0 .17 0 0 0 0 .06 0 0 0 .55 -.12'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E"),
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .32 0 0 0 0 .2 0 0 0 0 .08 0 0 0 .7 -.18'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  font-family:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;color:var(--ink);
  user-select:none;-webkit-user-select:none;
}
.stage{position:fixed;inset:0;perspective:2600px;perspective-origin:50% 40%}
.book{
  position:absolute;left:calc(50% - var(--pw));top:var(--top);width:calc(var(--pw)*2);height:var(--ph);
  transform-style:preserve-3d;transform:translateX(calc(var(--pw)*-.5));
  transition:transform 1.1s cubic-bezier(.5,.05,.2,1);
}
.book.open{transform:translateX(0)}
.page-r{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);background:#f6cfc7;
  box-shadow:0 14px 30px rgba(50,28,8,.38),0 2px 4px rgba(50,28,8,.3)}
.page-r>img.base{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.leaf{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;
  transform-origin:0 50%;transform:translateZ(2px);transition:transform 1.1s cubic-bezier(.5,.05,.2,1);
  box-shadow:0 14px 30px rgba(50,28,8,.38),0 2px 4px rgba(50,28,8,.3);cursor:pointer}
.book.open .leaf{transform:translateZ(2px) rotateY(-180deg);cursor:default}
.face{position:absolute;inset:0;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:#fbe9ea}
.face img{display:block;width:100%;height:100%;pointer-events:none}
.face.back{transform:rotateY(180deg)}
.cover-btn{position:absolute;inset:0;z-index:5;border:0;background:none;padding:0;cursor:pointer}
.book.open .cover-btn{pointer-events:none}
.spine{position:absolute;left:50%;top:0;height:100%;width:calc(var(--pw)*.07);transform:translateX(-50%) translateZ(3px);
  background:linear-gradient(90deg,transparent,rgba(60,25,15,.22) 46%,rgba(255,255,255,.14) 52%,transparent);
  opacity:0;transition:opacity .6s .5s;pointer-events:none}
.book.open .spine{opacity:1}
.tape{position:absolute;width:24%;height:6%;z-index:6;pointer-events:none;
  background:radial-gradient(circle,#f0a0b2 23%,transparent 25%) 0 0/14px 14px,rgba(250,236,200,.88);
  box-shadow:0 1px 3px rgba(60,30,10,.3);
  clip-path:polygon(0 8%,3% 0,6% 10%,9% 0,100% 0,100% 100%,9% 100%,6% 90%,3% 100%,0 92%)}
.t-tl{left:-7%;top:2%;transform:rotate(-38deg)}
.t-br{right:-7%;bottom:2.5%;transform:rotate(-38deg)}
/* letter page */
.peek{position:absolute;left:13%;top:19%;width:31%;height:62%;z-index:2;background:none;border:0;padding:0;cursor:pointer}
.letter{position:absolute;left:9.452%;top:6.682%;width:90.548%;height:84.187%;z-index:4;opacity:0;pointer-events:none;
  transform-origin:50% 50%;transition:transform .85s cubic-bezier(.2,.85,.25,1),opacity .3s .55s,filter .5s;cursor:pointer;
  filter:drop-shadow(0 0 0 rgba(0,0,0,0))}
.letter img{width:100%;height:100%;display:block}
.letter.lift{opacity:1;pointer-events:auto;transform:translate(-5.2%,1.5%) scale(.9) rotate(-1deg);
  transition:transform .85s cubic-bezier(.2,.85,.25,1),opacity .3s 0s,filter .5s;
  filter:drop-shadow(0 16px 18px rgba(40,10,15,.45))}
/* candles page */
.flame{position:absolute;transform-origin:50% 93%;will-change:transform,opacity;z-index:3;pointer-events:none;
  transition:opacity .4s ease,filter .4s}
.flame img{width:100%;height:100%;display:block;filter:drop-shadow(0 0 7px rgba(255,208,110,.85))}
.flame.out{opacity:0;filter:blur(2px)}
.flame.pop{animation:pop .5s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.2)}60%{opacity:1}100%{opacity:1}}
.smoke{position:absolute;z-index:4;width:6%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);animation:smoke 1.7s ease-out forwards}
@keyframes smoke{0%{opacity:.9;transform:translate(-50%,0) scale(.4)}100%{opacity:0;transform:translate(-20%,-420%) scale(2.2)}}
.wish{position:absolute;left:50%;top:17.5%;width:84%;z-index:7;text-align:center;pointer-events:none;
  transform:translateX(-50%) scale(.3) rotate(-4deg);opacity:0;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .4s}
.wish.show{opacity:1;transform:translateX(-50%) scale(1) rotate(-3deg)}
.wish span{display:inline-block;padding:.35em .9em .45em;background:#fff6ea;color:var(--ink);font-weight:700;
  font-size:calc(var(--pw)*.082);line-height:1.05;border-radius:6px;box-shadow:0 6px 14px rgba(60,10,20,.35),0 0 0 3px #fff6ea inset,0 0 0 4px #d9607c inset}
.note{position:absolute;left:5%;right:5%;bottom:2%;z-index:7;text-align:center;font-size:calc(var(--pw)*.045);
  line-height:1.05;color:#fff;background:rgba(94,15,42,.82);border-radius:8px;padding:.4em .6em;display:none}
.note.show{display:block}
/* toolbar */
.bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;
  align-items:center;padding:0 10px;min-height:52px;pointer-events:none}
.bar>*{pointer-events:auto}
.hint{font-size:26px;font-weight:700;color:#fff6ea;text-shadow:0 1px 2px rgba(60,30,10,.7);transition:opacity .4s}
.book.open~.bar .hint{display:none}
.controls{display:none;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center}
.book.open~.bar .controls{display:flex}
.btn{font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:var(--paper);border:2px dashed var(--ink);border-radius:10px;
  padding:4px 14px 6px;cursor:pointer;box-shadow:0 3px 0 rgba(60,25,10,.35);touch-action:none;user-select:none;-webkit-user-select:none}
.btn:active,.btn.on{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,25,10,.35);background:#ffd9df}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:var(--ink);background:var(--paper);border-radius:10px;
  padding:4px 10px;box-shadow:0 3px 0 rgba(60,25,10,.3);max-width:min(92vw,430px);line-height:1}
.meter{position:relative;width:96px;height:12px;border-radius:7px;background:#e8cdbb;overflow:hidden;flex:none;box-shadow:inset 0 1px 2px rgba(60,20,10,.4)}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#f08aa0,#c0204f)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.7}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.book,.leaf,.letter{transition-duration:.01s}}
</style>
</head>

   <button class="cover-btn" id="coverBtn" aria-label="Open the card"></button>
  </div>
  <div class="spine"></div>
 </div>
 <div class="bar">
  <span class="hint">tap the card to open it ♡</span>
  <div class="controls">
   <button class="btn" id="back">← back to cover</button>
   <div class="chip" id="chip" title="Tap to retry the microphone"><div class="meter"><i id="mfill"></i><b id="mtick"></b></div><span id="mtext">mic off</span></div>
   <button class="btn" id="hold">hold to blow</button>
   <button class="btn" id="relight" disabled>relight 🕯</button>
  </div>
 </div>
</div>
<canvas id="confetti"></canvas>
<script>
(function(){
'use strict';
var ASPECT=1587/2245;
var $=function(id){return document.getElementById(id)};
var book=$('book'),letter=$('letter'),wish=$('wish'),note=$('note'),rpage=$('rpage');
var flames=[].slice.call(document.querySelectorAll('.flame'));
var S={open:false,lifted:false,lit:true,blowT:0,blowAmt:0,level:0,floor:.004,manual:false,micState:'off',raf:0};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};

/* ---------- sizing ---------- */
function size(){
  var vw=innerWidth,vh=innerHeight,topM=28,botM=vw<640?118:84;
  var ph=Math.min(vh-topM-botM,(vw-28)/2/ASPECT);
  ph=Math.max(ph,180);
  var top=topM+Math.max(0,(vh-topM-botM-ph)/2);
  var r=document.documentElement.style;
  r.setProperty('--ph',ph+'px');r.setProperty('--pw',(ph*ASPECT)+'px');r.setProperty('--top',top+'px');
}
addEventListener('resize',size);size();

/* ---------- open / close ---------- */
function openCard(){
  if(S.open)return;S.open=true;book.classList.add('open');
  startMic();S.last=performance.now();cancelAnimationFrame(S.raf);S.raf=requestAnimationFrame(frame);
}
function closeCard(){
  if(!S.open)return;setLetter(false);S.open=false;book.classList.remove('open');S.manual=false;
  holdBtn.classList.remove('on');stopMic();
}
$('coverBtn').addEventListener('click',openCard);
$('back').addEventListener('click',closeCard);

/* ---------- letter ---------- */
function setLetter(v){S.lifted=v;letter.classList.toggle('lift',v)}
$('peek').addEventListener('click',function(){setLetter(true)});
letter.addEventListener('click',function(){setLetter(false)});

/* ---------- microphone ---------- */
var ctx=null,an=null,stream=null,buf=null;
function setMic(state){
  S.micState=state;
  var t={on:'mic on – blow into it',asking:'allow the mic…',off:'mic off – tap to enable',
    denied:'mic blocked – hold the button or press space',
    insecure:'mic needs https – host this file. Hold the button or press space for now',
    unsupported:'no mic support here – hold the button or press space'}[state];
  $('mtext').textContent=t;
  var secure=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  note.classList.toggle('show',!secure&&state!=='on');
  note.textContent='Mic blowing only works when this page is hosted over https, not opened as a local file. Use “hold to blow” or the space bar.';
}
function startMic(){
  if(stream)return;
  var secure=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setMic(secure?'unsupported':'insecure');return}
  setMic('asking');
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
    if(!S.open){s.getTracks().forEach(function(t){t.stop()});setMic('off');return}
    stream=s;var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
    var src=ctx.createMediaStreamSource(s);an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
    buf=new Float32Array(an.fftSize);if(ctx.state==='suspended')ctx.resume();setMic('on');
  }).catch(function(){setMic(secure?'denied':'insecure')});
}
function stopMic(){
  if(stream)stream.getTracks().forEach(function(t){t.stop()});
  if(ctx)ctx.close();stream=ctx=an=buf=null;setMic('off');note.classList.remove('show');
}
$('chip').addEventListener('click',function(){if(S.micState!=='on')startMic()});
function rms(){
  if(!an)return 0;an.getFloatTimeDomainData(buf);var s=0;
  for(var i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length);
}

/* ---------- hold to blow fallback ---------- */
var holdBtn=$('hold');
function hold(v){S.manual=v;holdBtn.classList.toggle('on',v)}
holdBtn.addEventListener('pointerdown',function(e){e.preventDefault();try{holdBtn.setPointerCapture(e.pointerId)}catch(_){}hold(true)});
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){holdBtn.addEventListener(n,function(){hold(false)})});
holdBtn.addEventListener('contextmenu',function(e){e.preventDefault()});
addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key===' '){
    if(!S.open){if(document.activeElement===$('coverBtn')){e.preventDefault();openCard()}return}
    e.preventDefault();if(!e.repeat)hold(true);
  }
});
addEventListener('keyup',function(e){if((e.code==='Space'||e.key===' ')&&S.open){e.preventDefault();hold(false)}});

/* ---------- flames ---------- */
function extinguish(){
  S.lit=false;
  flames.forEach(function(f,i){
    setTimeout(function(){
      f.classList.add('out');
      var s=document.createElement('div');s.className='smoke';
      s.style.left=(parseFloat(f.style.left)+parseFloat(f.style.width)/2)+'%';
      s.style.top=(parseFloat(f.style.top)+parseFloat(f.style.height)*.82)+'%';
      rpage.appendChild(s);setTimeout(function(){s.remove()},1800);
    },i*110);
  });
  setTimeout(function(){wish.classList.add('show');$('relight').disabled=false;confetti()},520);
}
$('relight').addEventListener('click',function(){
  if(S.lit)return;S.lit=true;S.blowT=0;wish.classList.remove('show');$('relight').disabled=true;
  flames.forEach(function(f,i){f.classList.remove('out','pop');void f.offsetWidth;f.style.animationDelay=(i*120)+'ms';f.classList.add('pop')});
});

/* ---------- main loop ---------- */
function frame(now){
  if(!S.open&&S.blowAmt<.01){return}
  var dt=Math.min(.05,(now-S.last)/1000);S.last=now;
  var raw=rms();S.level+=(raw-S.level)*Math.min(1,dt*16);
  var thr=Math.max(.05,S.floor*4.5);
  if(S.level<thr*.7)S.floor+=(S.level-S.floor)*dt*.6;
  var target=S.manual?1:(S.level>thr?clamp(.4+(S.level-thr)/.1,0,1):0);
  S.blowAmt+=(target-S.blowAmt)*Math.min(1,dt*9);
  if(S.lit&&S.open){
    if(target>.3)S.blowT+=dt;else S.blowT=Math.max(0,S.blowT-dt*.8);
    if(S.blowT>=.5)extinguish();
  }
  var b=S.blowAmt,t=now/1000;
  flames.forEach(function(f,i){
    if(!S.lit)return;
    var w=Math.sin(t*9+i*2.1),w2=Math.sin(t*5.3+i);
    var ang=b*36+w*(1.3+b*6);
    f.style.transform='rotate('+ang.toFixed(2)+'deg) skewX('+(-b*9).toFixed(2)+'deg) scale('+(1-b*.1).toFixed(3)+','+(1+w2*.025-b*.12).toFixed(3)+')';
  });
  var v=S.manual?Math.max(.8,clamp(S.level*3.2,0,1)):Math.pow(clamp(S.level*3.2,0,1),.6);
  $('mfill').style.width=(v*100)+'%';
  $('mtick').style.left=(Math.pow(clamp(thr*3.2,0,1),.6)*100)+'%';
  S.raf=requestAnimationFrame(frame);
}

/* ---------- confetti ---------- */
var cv=$('confetti'),cx=cv.getContext('2d'),parts=[],cRaf=0;
function fit(){var d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function confetti(){
  var cols=['#d9607c','#f4a9b8','#5e0f2a','#f2c14e','#fff6ea','#b23a63','#e9967a'];
  var r=rpage.getBoundingClientRect();
  for(var i=0;i<170;i++){
    var burst=i<90,x=burst?r.left+r.width*(.3+Math.random()*.4):Math.random()*innerWidth;
    var y=burst?r.top+r.height*.55:-20-Math.random()*innerHeight*.4;
    parts.push({x:x,y:y,vx:(Math.random()-.5)*(burst?13:3),vy:burst?-(7+Math.random()*12):1+Math.random()*3,
      w:6+Math.random()*7,h:4+Math.random()*6,rot:Math.random()*6.3,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],round:Math.random()<.25,ph:Math.random()*6});
  }
  cancelAnimationFrame(cRaf);cRaf=requestAnimationFrame(cStep);
}
function cStep(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.y<innerHeight+30});
  parts.forEach(function(p){
    p.vy+=.22;p.vx*=.99;p.vy*=.992;p.x+=p.vx+Math.sin(p.ph+=.05)*.6;p.y+=p.vy;p.rot+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2.2,0,6.3);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  });
  if(parts.length)cRaf=requestAnimationFrame(cStep);
}
setMic('off');
window.__card={S:S,openCard:openCard,closeCard:closeCard};
})();
</script>
